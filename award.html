<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>南方电网中标公示看板</title>
<style>
  :root{--ink:#0f172a;--muted:#64748b;--line:#e2e8f0;--brand:#0e7490;--brand2:#0891b2;--accent:#f59e0b;--chip:#f1f5f9;--panel:#fff;--shadow:0 1px 3px rgba(15,23,42,.08),0 8px 24px rgba(15,23,42,.06);}
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;color:var(--ink);background:#f6f8fb;line-height:1.5;-webkit-font-smoothing:antialiased}
  a{color:var(--brand);text-decoration:none}
  .hero{background:linear-gradient(120deg,#0e7490,#155e75 55%,#164e63);color:#fff;padding:30px 24px 66px;position:relative;overflow:hidden}
  .hero::after{content:"";position:absolute;inset:0;background:radial-gradient(600px 200px at 85% -20%,rgba(255,255,255,.18),transparent);pointer-events:none}
  .hero-inner{max-width:1360px;margin:0 auto;position:relative;z-index:1}
  .nav{display:flex;gap:8px;margin-bottom:14px}
  .nav a{padding:6px 14px;border-radius:999px;font-size:13px;color:#fff;border:1px solid rgba(255,255,255,.35)}
  .nav a.on{background:rgba(255,255,255,.2);border-color:#fff}
  .hero h1{margin:0 0 6px;font-size:25px;display:flex;align-items:center;gap:10px}
  .hero h1 .dot{width:10px;height:10px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 4px rgba(245,158,11,.25)}
  .hero p{margin:0;color:rgba(255,255,255,.82);font-size:13.5px}
  .wrap{max-width:1360px;margin:-48px auto 0;padding:0 18px 60px;position:relative;z-index:2}
  .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:16px}
  .stat{background:var(--panel);border-radius:14px;padding:14px;box-shadow:var(--shadow);border:1px solid var(--line)}
  .stat .n{font-size:22px;font-weight:700;color:var(--brand)}
  .stat .l{font-size:12.5px;color:var(--muted);margin-top:2px}
  .card{background:var(--panel);border-radius:14px;box-shadow:var(--shadow);border:1px solid var(--line);padding:14px 16px;margin-bottom:16px}
  .filters{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:10px}
  .filters label{font-size:11.5px;color:var(--muted);display:block;margin-bottom:3px}
  .filters input{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:9px;font-size:13px;background:#fff;color:var(--ink)}
  .filters input:focus{outline:none;border-color:var(--brand2);box-shadow:0 0 0 3px rgba(8,145,178,.14)}
  .toolbar{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;margin-bottom:10px}
  .toolbar .count{color:var(--muted);font-size:12.5px}
  .btn{font-size:12.5px;padding:7px 12px;border-radius:9px;border:1px solid var(--line);background:#fff;cursor:pointer;font-weight:600;color:var(--ink)}
  .btn:hover{background:#f8fafc}
  .tbl-wrap{overflow-x:auto}
  table{width:100%;border-collapse:collapse;font-size:13px;min-width:1120px}
  th,td{padding:9px 9px;text-align:left;vertical-align:top;border-bottom:1px solid var(--line)}
  th{font-size:12px;color:#334155;font-weight:700;background:#f1f5f9;white-space:nowrap;position:sticky;top:0}
  td.t{max-width:300px;min-width:220px}
  td.t a{font-weight:600;color:var(--ink)} td.t a:hover{color:var(--brand)}
  td.proj{max-width:260px;color:#334155}
  .amt{color:#b91c1c;font-weight:700;white-space:nowrap}
  .muted{color:var(--muted)}
  .pager{display:flex;gap:8px;align-items:center;justify-content:center;flex-wrap:wrap;margin-top:16px}
  .pager button{min-width:36px;height:36px;padding:0 10px;border:1px solid var(--line);background:#fff;border-radius:9px;cursor:pointer;font-size:13px;font-weight:600}
  .pager button.active{background:var(--brand);color:#fff;border-color:var(--brand)}
  .pager button:disabled{opacity:.4;cursor:not-allowed}
  .empty{text-align:center;color:var(--muted);padding:40px 0}
  .foot{max-width:1360px;margin:0 auto;padding:18px;color:var(--muted);font-size:12px;text-align:center}
  @media(max-width:900px){.stats{grid-template-columns:repeat(2,1fr)}.filters{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<div class="hero"><div class="hero-inner">
  <div class="nav"><a href="index.html">招标公告</a><a class="on" href="award.html">中标公示</a></div>
  <h1><span class="dot"></span>南方电网中标公示看板</h1>
  <p>仅最近 3 天中标公示 · 按 发布日期/采购单位/公示标题/项目名称/分标编号/分标名称/包号/中标候选人/金额 展示与筛选</p>
</div></div>
<div class="wrap">
  <div class="stats" id="stats"></div>
  <div class="card">
    <div class="filters" id="filters"></div>
    <div class="toolbar">
      <div class="count" id="count"></div>
      <button class="btn" id="reset">清空筛选</button>
    </div>
    <div class="tbl-wrap">
      <table>
        <thead><tr>
          <th>发布日期</th><th>采购单位</th><th>公示标题</th><th>项目名称</th>
          <th>分标编号</th><th>分标名称</th><th>包号</th><th>中标候选人</th><th>金额（万元）</th>
        </tr></thead>
        <tbody id="tbody"></tbody>
      </table>
    </div>
    <div class="empty" id="empty" style="display:none">没有匹配的中标公示。</div>
    <div class="pager" id="pager"></div>
  </div>
</div>
<div class="foot">数据来源：中国南方电网供应链统一服务平台 · 中标公示频道 · 仅最近3天 · 自动采集</div>
<script>
const PAGE=15; let DATA=[], ROWS=[], page=1;
const FIELDS=[
  {k:"date",  label:"发布日期"},
  {k:"buyer", label:"采购单位"},
  {k:"title", label:"公示标题"},
  {k:"project",label:"项目名称"},
  {k:"seq",   label:"分标编号"},
  {k:"item",  label:"分标名称"},
  {k:"pkg",   label:"包号"},
  {k:"cand",  label:"中标候选人"},
  {k:"amt",   label:"金额（万元）"},
];
let FILTERS={};
const esc=s=>(s==null?"":String(s)).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function buildRows(){
  ROWS=[];
  DATA.forEach(x=>{
    const base={date:x.date||"", buyer:x.tenderer||"", title:x.title||"", link:x.link||"", project:x.project||x.title||""};
    if(x.rows&&x.rows.length){
      x.rows.forEach(r=>ROWS.push({...base, seq:r["分标编号"]||"", item:r["分标名称"]||"", pkg:r["包号"]||"", cand:r["中标候选人"]||"", amt:r["金额"]||""}));
    }else{
      ROWS.push({...base, seq:"", item:"", pkg:"", cand:"", amt:""});
    }
  });
}
function stats(){
  const gongshi=DATA.length, rows=ROWS.length;
  const buyers=new Set(DATA.map(x=>x.tenderer).filter(Boolean));
  const cands=new Set(); ROWS.forEach(r=>r.cand&&cands.add(r.cand));
  document.getElementById("stats").innerHTML=[
    ["中标公示",gongshi+" 条"],["明细行",rows+" 行"],["采购单位",buyers.size+" 家"],["中标候选人",cands.size+" 家"]
  ].map(d=>`<div class="stat"><div class="n">${esc(d[1])}</div><div class="l">${esc(d[0])}</div></div>`).join("");
}
function renderFilters(){
  document.getElementById("filters").innerHTML=FIELDS.map(f=>
    `<div><label>${esc(f.label)}</label><input data-k="${f.k}" value="${esc(FILTERS[f.k]||"")}" placeholder="筛选${esc(f.label)}"></div>`).join("");
}
function filtered(){
  return ROWS.filter(r=>FIELDS.every(f=>{
    const q=(FILTERS[f.k]||"").trim().toLowerCase();
    if(!q) return true;
    return String(r[f.k]||"").toLowerCase().includes(q);
  }));
}
function rowHtml(r){
  return `<tr>
    <td class="muted" style="white-space:nowrap">${esc(r.date)}</td>
    <td>${esc(r.buyer)||'<span class="muted">—</span>'}</td>
    <td class="t"><a href="${esc(r.link)}" target="_blank" rel="noopener">${esc(r.title)}</a></td>
    <td class="proj">${esc(r.project)}</td>
    <td>${esc(r.seq)||'<span class="muted">—</span>'}</td>
    <td>${esc(r.item)||'<span class="muted">—</span>'}</td>
    <td>${esc(r.pkg)||'<span class="muted">—</span>'}</td>
    <td>${esc(r.cand)||'<span class="muted">详见原文</span>'}</td>
    <td class="amt">${esc(r.amt)||'—'}</td>
  </tr>`;
}
function pager(tp){
  const el=document.getElementById("pager");
  if(tp<=1){el.innerHTML="";return;}
  let h=`<button ${page<=1?"disabled":""} data-go="${page-1}">‹</button>`;
  const win=[];
  if(tp<=7){for(let i=1;i<=tp;i++)win.push(i);}else{win.push(1);if(page>3)win.push("…");for(let i=Math.max(2,page-1);i<=Math.min(tp-1,page+1);i++)win.push(i);if(page<tp-2)win.push("…");win.push(tp);}
  win.forEach(p=>h+=p==="…"?'<span style="color:#64748b">…</span>':`<button class="${p===page?"active":""}" data-go="${p}">${p}</button>`);
  h+=`<button ${page>=tp?"disabled":""} data-go="${page+1}">›</button>`;
  el.innerHTML=h;
}
function render(){
  const rows=filtered(); const tp=Math.max(1,Math.ceil(rows.length/PAGE));
  if(page>tp)page=tp; if(page<1)page=1;
  const st=(page-1)*PAGE, pr=rows.slice(st,st+PAGE);
  document.getElementById("count").textContent=rows.length?`显示 ${st+1}–${Math.min(st+PAGE,rows.length)} / 共 ${rows.length} 行 · 第 ${page}/${tp} 页`:`共 0 行`;
  document.getElementById("empty").style.display=rows.length?"none":"block";
  document.getElementById("tbody").innerHTML=pr.map(rowHtml).join("");
  pager(tp);
}
document.getElementById("filters").addEventListener("input",e=>{const i=e.target.closest("input[data-k]");if(!i)return;FILTERS[i.dataset.k]=i.value;page=1;render();});
document.getElementById("reset").addEventListener("click",()=>{FILTERS={};page=1;renderFilters();render();});
document.getElementById("pager").addEventListener("click",e=>{const b=e.target.closest("button[data-go]");if(!b||b.disabled)return;page=+b.dataset.go;render();});
fetch("award.json",{cache:"no-store"}).then(r=>r.json()).then(d=>{DATA=d||[];buildRows();stats();renderFilters();render();}).catch(e=>{document.getElementById("count").textContent="加载失败："+e;});
</script>
</body>
</html>
